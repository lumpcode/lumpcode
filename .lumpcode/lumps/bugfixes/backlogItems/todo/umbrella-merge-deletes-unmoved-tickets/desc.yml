# yaml-language-server: $schema=https://lumpcode.com/schemas/featureBacklogDesc.schema.json
name: umbrella-merge-deletes-unmoved-tickets
workflow:
  - impl
task: >-
  folderSetTaskDoneStep's umbrella merge skips a destination directory that
  already exists (completed/<parent>/tickets) and then deletes the todo tree,
  so tickets and files that were never moved are removed.
priority: 20

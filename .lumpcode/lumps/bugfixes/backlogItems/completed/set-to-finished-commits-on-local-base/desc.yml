name: set-to-finished-commits-on-local-base
workflow:
  - impl
task: >-
  context-status --setToFinished (setContextToFinishedStatus in the CLI)
  switches the operator's checkout to the local base branch and runs git commit
  there, so the push is rejected whenever local base is behind origin (the
  normal state after a squash merge, leaving stray marker commits behind) and
  anything already staged is pushed to origin/<baseBranch> inside the "empty"
  marker commit; build the marker on the refreshed origin/<baseBranch> tip
  without touching HEAD, the index, or the working tree.
priority: 20

name: stop-all-slow-exit-drain
workflow:
  - impl
task: >-
  lumpcode stop --all aborts with a bare "Process pid N did not exit within 5s."
  when one daemon is slow to exit after SIGTERM, leaving the other daemons and
  the supervisor running; treat that daemon as draining so --all keeps going,
  and cover that a draining daemon exits and frees its locks after the stop wait
  is interrupted.

# yaml-language-server: $schema=https://lumpcode.com/schemas/featureBacklogDesc.schema.json
name: history-and-transcripts
workflow: [req, impl]
task: >-
  Keep keepHistory. Fix append so a bad file cannot drop the next entry.
  Today append reads the whole YAML file and writes it back, so one parse
  failure skips the new entry (the step walk only warns). Replace that with
  append-only JSONL: one JSON object per line, the same fields as HistoryEntry
  (prompt, commandResult, commandSucceeded, context, stepIndex,
  contextRunState, lumpVariables, stepVariables, projectRoot). Sanitize
  ANSI/C0 in prompt and commandResult as today. A line that does not parse is
  skipped on read. Append does not read the file first. A stringify failure
  warns and skips that entry. The step walk still continues. New files are
  .jsonl under the same gitignored history directory. Existing .yaml files
  stay on disk and are not converted. writeTranscripts stays as it is.
priority: 5

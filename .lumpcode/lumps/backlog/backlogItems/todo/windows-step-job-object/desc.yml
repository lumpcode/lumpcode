# yaml-language-server: $schema=https://lumpcode.com/schemas/featureBacklogDesc.schema.json
name: windows-step-job-object
workflow: [manualReq, testImpl, impl]
task: >-
  On Windows, run each step command in its own Job Object and kill everything
  left in it when the step ends, fails, times out, or is aborted, and when the
  daemon is force-stopped or dies. That way a Windows worker stops leaking
  processes the way Linux and macOS workers no longer do. Background and
  constraints: reference.md.
priority: 32

name: see-lump-context-run-time
workflow: [req, testImpl, impl]
task: >-
  Show how long the context that is running right now has been running. On the
  worker dashboard, and on lumpcode daemon-status: human lines read
  "backlog / ctx-a for 12m", and --json adds runningForSeconds on each
  inFlightRuns row. Count from when that context started walking. A foreground
  lumpcode run does not print a second timer. No history of past durations for
  now. Promoted from IDEAS.
priority: 34

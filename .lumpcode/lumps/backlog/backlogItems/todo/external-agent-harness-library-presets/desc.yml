# yaml-language-server: $schema=https://lumpcode.com/schemas/featureBacklogDesc.schema.json
name: external-agent-harness-library-presets
workflow: [req, impl]
task: >-
  Where a vendor SDK can run that agent's local preset, use the SDK instead
  of the hand-written argv in presets/commands. Do not adopt
  @pivanov/agents-wire (not actively maintained) or another third-party
  library that unifies every CLI, including coding-agent-runner.
  @cursor/sdk is already a dependency for the ideasToBacklog cloud agent;
  the cursor preset may use it for the local cursor-agent run. Copilot,
  Claude Code, OpenCode, and Codex stay on their current argv until that
  vendor's SDK can do the same job. Not ACP streaming. Distinct from
  presets-typescript-package, which only changes how the current argv
  files are authored.
  The operator-facing variables stay. lumpVariables and stepVariables
  still supply model (step overrides lump; cursor and copilot still
  default to auto; claude-code, opencode, and codex still omit the flag
  when model is unset). agentPermissions stays the closed per-preset
  object. Session keys newChat and chatIdIndex stay. outputDetail stays.
  Effort stays where it is today: extraArgs, or a Cursor model slug such
  as claude-opus-5-5-high. Do not add an effort field.
  extraArgs is how a lump passes a flag the preset does not know yet. It
  stays a string list. A step list still replaces the lump list, and []
  still clears it. Requirements must say, for each preset that moves to
  an SDK, where those strings go, including flags added after this change.
  If that SDK cannot pass the list through, that preset does not move.
  Codex still needs its list before resume. Do not drop extraArgs or fold
  unknown flags into a typed map that rejects a new flag.
priority: 80
dependsOn:
  - release-0-11-0

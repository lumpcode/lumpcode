name: clean-local-project-json-config
manualReq: true
task: >-
  Clean up local.json / project.json ownership and precedence. Allow local.json
  properties in project.json with project.json taking priority for those shared
  fields; enable running a solo-lump or global daemon with custom
  local.json/project.json properties. Keep only mode and workspaceStrategy as
  local.json-only properties, and projectName as project.json-only. Allow some
  LumpJsConfig params (e.g. command, maximumNumberOfConcurrentBranches) in
  project.json/local.json with precedence lump config > local.json >
  project.json. Add a clean TypeScript type for this shared config surface.
priority: 5

# yaml-language-server: $schema=https://lumpcode.com/schemas/featureBacklogDesc.schema.json
name: transcript-command
workflow: [manualReq, impl]
task: >-
  Add a CLI command that prints a daemon transcript. The file is
  .lumpcode/lumps/<lumpName>/transcripts/<branch>/<stamp>.log, written by a
  daemon tick. The command does not read the daemon log. lumpcode run still
  prints the live feed in the terminal and does not write a file.
priority: 3
dependsOn:
  - live-step-transcripts

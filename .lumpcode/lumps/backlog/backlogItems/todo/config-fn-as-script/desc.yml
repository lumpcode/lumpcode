# yaml-language-server: $schema=https://lumpcode.com/schemas/featureBacklogDesc.schema.json
name: config-fn-as-script
stages: [manualReq, testImpl, impl]
manual: true
task: >-
  Parked: TypeScript first; JSON is experimental. Not for autoTriage. A human will grill this before requirements.md
  exists. A JSON or YAML lump config may set a function field to a command
  string instead of inline TypeScript. getContextListFn, prompt functions,
  steps, and the other function fields work this way. Lumpcode runs the
  command with one JSON object on stdin, the same object the TypeScript
  function receives, and reads the return value as one JSON value on stdout.
  The script destructures that object. AbortSignal is not passed; the process
  is killed on abort. A script can print JSON steps only, not a new function.
  Separate from yaml-lump-configs, which is only the file format.
priority: 64
dependsOn:
  - release-0-11-0

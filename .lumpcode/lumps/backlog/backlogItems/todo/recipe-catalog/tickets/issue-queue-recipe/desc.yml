# yaml-language-server: $schema=https://lumpcode.com/schemas/featureBacklogDesc.schema.json
name: issue-queue-recipe
workflow: [manualReq, testImpl, impl]
task: >-
  `issueQueue({…})`: open issues with a given label on GitHub (`gh`), GitLab
  (`glab`) or Azure DevOps (`az`) become contexts, one issue each, with its
  number in the context name and its title and body in variables. An issue is
  done when its branch is merged, like any context. The CLI gains no host
  integration; the recipe calls the host CLI. Commenting on or closing the
  issue is out of scope.
priority: 29

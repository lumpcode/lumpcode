# yaml-language-server: $schema=https://lumpcode.com/schemas/featureBacklogDesc.schema.json
name: reuse-existing-lump-branch
workflow: [manualReq, testImpl, impl]
task: >-
  A dedicated run may check out an existing branch and commit on it, instead
  of creating lump/<lumpName>/…. The branch is chosen from the context. It is
  the branch the run modifies, not the base branch a pull request would target.
  baseBranch stays where the lump forks and where finished is read. JS/TS can
  already set baseBranch from the context list. Setup today fetches that base,
  hard-resets to it, deletes the work-branch name, and runs git switch -c.
  branchFn only picks the new name. This ticket is the path that checks out
  the existing branch and pushes onto it. Wait for a human requirements.md
  before testImpl and impl.
priority: 5

name: cleaner-core-git-fns
manualReq: true
workflow: directImpl
task: >-
  Update core with three cleaner git injectors on RunLump /
  executeStepsForContextList: gitAddCommitFn (add + commit), gitCommitMessageFn,
  and gitPushFn. Each returns Promise<Success<Maybe<string>> | Failure<string>>
  (string means core should execAsync it; null/undefined means the injector
  already did the work or no-op). Keep gitAddCommandFn, gitCommitCommandFn, and
  gitPushCommandFn deprecated; during implementation, incorporate the legacy
  fields into a concise gitAddCommitFn (and the other new hooks) so callers can
  migrate. Update defaults, types, and tests; CLI should prefer the new hooks
  for locked add+commit and push.
priority: 6

# yaml-language-server: $schema=https://lumpcode.com/schemas/featureBacklogDesc.schema.json
name: preset-output-loudness
workflow: [manualReq, testPlan, testImpl, impl]
task: >-
  Let a lump or step set outputDetail. loud (the default) keeps the full
  session view. quiet keeps assistant text and drops tool activity from the
  live feed. Raw command output is unchanged.
priority: 2
dependsOn:
  - live-step-transcripts

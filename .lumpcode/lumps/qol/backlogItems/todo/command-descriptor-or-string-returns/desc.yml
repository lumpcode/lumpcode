# yaml-language-server: $schema=https://lumpcode.com/schemas/featureBacklogDesc.schema.json
name: command-descriptor-or-string-returns
workflow: [manualReq, testImpl, impl]
task: >-
  Git and workspace hooks may return a CommandDescriptor or a shell string.
  gitAddCommitFn today returns success('git add . && git commit …') for the
  engine to run, or success(null) when the commit is already done. Workspace
  setup returns { command: 'git switch … && git switch -c …', workspacePath }.
  A descriptor is { executable, args, env? }, so a branch name with a space
  is an argument and not part of a shell line. A string is still allowed.
  What null means stays for the human plan. This does not change a step
  command. That is command-fn-result-return: a step may return a shell string
  to spawn, or { commandResult, commandSucceeded } and spawn nothing.
priority: 2

# yaml-language-server: $schema=https://lumpcode.com/schemas/featureBacklogDesc.schema.json
name: project-local-config-field-layers
stages: [manualReq, testImpl, impl]
task: >-
  Single source of truth for where a config field may live: project.json,
  local.json, both with local winning, and whether the lump config may set it
  too. Lump wins over local over project when the lump value is not undefined.
  Today those marks are duplicated: Zod allowlists, SHARED_KEYS, the
  ProjectJsonConfig / LocalJsonConfig picks, and LUMP_DEFAULT_KEYS in
  applyLumpConfigDefaults. Derive them from one table so they cannot drift.
  Parameterize merge tests from the table. Does not change which file accepts
  a field, or the merge order. Lump-only fields such as steps stay out of the
  table.
priority: 60
dependsOn:
  - backlog/release-0-11-0

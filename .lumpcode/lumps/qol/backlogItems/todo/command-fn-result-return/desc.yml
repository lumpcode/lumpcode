# yaml-language-server: $schema=https://lumpcode.com/schemas/featureBacklogDesc.schema.json
name: command-fn-result-return
workflow: [manualReq, testImpl, impl]
task: >-
  A step command may return a shell string or an in-process result, besides
  today's CommandDescriptor and the nullish skip. A shell string is spawned:
  command: () => 'npm run test'. An in-process result is not spawned:
  command: () => ({ commandResult: 'missing src/x.ts', commandSucceeded: false }).
  History, postCommandExecFn, and continueOnError see that result the way
  they see a command that ran. A string command field with no whitespace
  stays a tag or a module path. A string command field that contains
  whitespace is a shell line. Git and workspace hooks are
  command-descriptor-or-string-returns, not this ticket.
priority: 2

    opt-in framing as opening PRs: commenting is a recipes helper, not a built-in.
    Complementary to `openPrPostTeardown`, which opens the pull request. Not
    keepHistory / transcripts.
  blocked: >-
    parked: needs recipe helper design (when it runs vs openPr, session resume
    contract, GitHub-only)
  tags: [recipes, git, presets, hooks]

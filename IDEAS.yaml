# Committed idea intake for ideasToBacklog lump (name + task; optional blocked, priority, tags).
# priority: lower number = more important. Parked ideas set blocked to a short reason.
# tags: optional list for scanning; ideasToBacklog ignores unknown keys.
#   daemon | git | status | hooks | history | config | engine | cli | recipes |
#   workspace | presets | hygiene | skills | cloud | auth | agents | sandbox | meta
# Ephemeral names (1, A) are OK.
- name: install-worker-on-your-cloud-cta
  task: >-
    New package under packages/apps/ in this monorepo. One action installs a worker
    on a cloud the operator already has (AWS, Azure, Hetzner, DigitalOcean, Cloudflare
    when it fits). They give cloud credentials, a git host (GitHub, GitLab, Bitbucket,
    or Azure DevOps), a machine size, and a repo. The package provisions that machine
    and leaves the worker running. The website gets a call to action that starts
    this install. Split into child tickets when promoted.
  priority: 22
  tags: [cloud]
- name: see-lump-context-run-time
  task: >-
    Show how long the context that is running right now has been running. On the
    worker dashboard, and on lumpcode daemon-status: human lines read
    "backlog / ctx-a for 12m", and --json adds runningForSeconds on each
    inFlightRuns row. Count from when that context started walking. A foreground
    lumpcode run does not print a second timer. No history of past durations for now.
  priority: 18
  tags: [status]
- name: git-access-heartbeat
  task: >-
    On each daemon tick, before any lump runs, check read/write access to the git
    remote without updating a ref. Run
    `git push --dry-run origin :refs/heads/__lumpcode_access_probe__`.
    Access is ok when the remote answers that __lumpcode_access_probe__ does not
    exist. Access is not ok when the command fails earlier (host unreachable,
    authentication failed, or a read-only key or token). Do not use git ls-remote
    for this check; that only opens the fetch endpoint. When access is not ok,
    skip the tick and show the failure on lumpcode daemon-status and the worker
    dashboard. A foreground lumpcode run still fails on its own git call, with no
    extra heartbeat.
  priority: 19
  tags: [git, daemon]
- name: cli-command-names-by-group
  task: >-
    Clean CLI command names by group. Canonical name is `<group>-<verb>` (e.g. `daemon-start`,
    `daemon-stop`, `daemon-restart`); today's short names stay as shorthands (`start` → `daemon-start`).
    Apply the same pattern across groups (`lump-plan` / `lump-status` / `lump-create`, `project-setup`)
    so mixed prefixes like `start` vs `daemon-status` go away. Document only the current spelling.
    This idea is naming, not merging commands.
  priority: 25
  blocked: Breaking rename. Decide the alias map before any command moves. Not for autoTriage.
  tags: [cli]
- name: run-start-lump-variable-overrides
  task: >-
    lumpcode run and lumpcode start accept lumpVariables overrides for that
    invocation. The lump file stays unchanged. --contextName stays a separate
    flag that only picks a context.
  priority: 31
  tags: [cli, config]
- name: project-local-tick-hooks
  task: >-
    project.json and local.json may set onBeforeDiscovery, onTickBegin, and
    onTickEnd. Each value is a command string, not a function. When both files
    set the same hook, local.json wins. A daemon tick runs them. A foreground
    lumpcode run does not. Example: npm i once per tick.
  priority: 34
  tags: [daemon, hooks]
- name: yaml-lump-configs
  task: A lump config may be YAML as well as JSON or TypeScript.
  priority: 36
  tags: [config]
- name: per-lump-git-remote
  task: >-
    Optional git remote name. Default remains origin. May be set on the lump,
    on project.json, or on local.json. The lump value wins, then local.json,
    then project.json. One name, not a list of remotes.
  priority: 42
  tags: [git, config]
- name: lump-marker-prefix-override
  task: >-
    project.json only. Override the lump/ branch prefix and the LUMP marker
    prefix. Each value is a list. The first entry is the prefix in use. Later
    entries are previous prefixes still recognized on branches and marker lines.
    Dropping an old prefix means those older branches and markers stop counting.
  priority: 44
  tags: [git, config]
- name: dynamic-base-branch-from-context-list
  task: >-
    baseBranch may be a function of the context list for that run. Discovery
    still chooses where the lump is found. This is not a second git remote.
  priority: 20
  tags: [git, config]
- name: read-json-file-failure-codes
  task: >-
    readJsonFile failures include a code, not-found or invalid-json, and the
    message stays human-readable.
  priority: 45
  tags: [engine, hygiene]
- name: unify-monorepo-tsconfig

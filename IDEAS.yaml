- name: rethink-lump-history-storage
  task: >-
    Rethink lump history persistence (`keepHistory: true` →
    `.lumpcode/lumps/<lumpName>/history/<contextName>.yaml`). Today
    `packages/core/src/utils/historyFile/main.ts` read-modify-writes a full YAML array of
    `HistoryEntry` objects (prompt, commandResult, context, stepIndex, contextRunState,
    lumpVariables, etc.) on every step append. All-YAML has proven fragile: js-yaml literal blocks
    break on ANSI escapes in verification output (SEA build colors, vitest); verify loops duplicate
    full `npm run build && npm run test` output in both commandResult and retry prompts (45KB+ for a
    handful of entries); corrupt files block further appends until manual repair. Recent mitigations
    (write sanitization, read-side ANSI recovery, non-blocking history errors in
    executeStepsForContextList) are band-aids. Tier 1 near-term (may ship before format change):
    truncate large prompt/commandResult fields; post-write YAML round-trip validation. Tier 2/3
    direction to evaluate: append-only JSONL per context, or a split layout — small YAML/JSON index
    per context plus separate `.log` (or hashed blob) files for full command output. Preserve
    resumable session semantics (contextRunState, command module setup keys) regardless of format.
    Update project-setup gitignore and CLI docs if paths change. Complements
    `option-for-light-history` (content shape) but targets storage robustness.
- name: compose-post-setup-workspace-hooks
  task: >-
    Allow custom per-lump workspace prep by composing on top of CLI-generated `workspaceStrategy`
    (`checkout` | `worktree` from `.lumpcode/local.json` via `makeLumpWorkspaceFns`), not by
    re-exposing raw core `setupWorkspaceFn` / `teardownWorkspaceFn` on `LumpJsConfig`. Operators
    need install deps, copy env files, codegen, etc. inside the branch workspace after git setup
    while keeping correct strategy-owned `workspacePath` (locks + agent cwd) and dedicated worktree
    `afterExec` lock release via `withSetupWorkspaceAfterExec`. Preferred: optional lump-config
    `postSetupWorkspaceFn` (FilePath or fn) receiving `{ baseBranch, branchName, contextList,
    workspacePath, executionWorkspacePath, workspaceStrategy }`, returning optional `{ command?,
    afterExec? }` chained after built-in setup — user must not override `workspacePath`; chain
    `afterExec` so lock-layer release still works. Optional twin `postTeardownWorkspaceFn`. Smaller
    JSON-only alternative: `postSetupWorkspaceCommand` string append (`builtIn && userCommand`).
    Non-goals: raw setup/teardown knobs on lump config; full replace of generated fns unless a later
    `"custom"` strategy defines a path contract for locks. Touch: primarily `packages/apps/cli`
    (`jsConfigToRunLumpInput`, `makeLumpWorkspaceFns`, `LumpJsConfig`, schema, DOCS); core likely
    unchanged; `withWorkspaceLockHooks` stays outermost if path remains strategy-owned. Note:
    existing `setupFn` is the wrong layer (per-context, after workspace setup, no `workspacePath`).
- name: external-agent-harness-library-presets
  task: >-
    Replace or thin further hand-rolled per-agent preset argv wiring (`presets/commands/cursor.js`,
    `copilot.js`, etc.) by adopting an external OSS TypeScript library that unifies spawning/calling
    local agent harnesses (Copilot CLI, Cursor CLI, Claude Code, OpenCode, Codex, …). Candidates:
    `@pivanov/agents-wire`, `coding-agent-runner`, or vendor SDKs (e.g. `@cursor/sdk` for
    Cursor-only). Goal: reliable invoke surface (prompt, resume/session, model, permissions) without
    maintaining per-CLI flag maps — still fits Lumpcode's thin `CommandDescriptor` model; not full
    ACP streaming. Deferred; DIY presets remain default for now.
- name: acp-streaming-agent-sessions
  task: >-
    Optionally integrate Agent Client Protocol (ACP) streaming into Lumpcode command modules and/or
    the core step walk: persistent JSON-RPC sessions with `session/prompt` + live `session/update`
    (text chunks, tool calls, plans), mid-run permissions, and cancel — instead of or in addition to
    fire-and-forget CLI `-p` spawn + wait for exit. Candidates: `@agentclientprotocol/sdk` and/or
    ACP-speaking libraries. Architectural (richer progress than stdout/stderr); distinct from merely
    using a library to build argv. Deferred; keep thin presets for now.
- name: internal-test-utils-package
  task: >-
    Add a private workspace-only package (e.g. `@lumpcode/test-utils`, not published to npm) for
    shared Vitest/e2e fixtures, platform shims, and other test helpers currently duplicated or
    living next to production code / exported from publishable packages. Motivating case:
    `windowsNpmCmdShimBody` under `@lumpcode/core` is exported so CLI e2e can reuse it — odd on the
    core public surface. Target consumers: core unit tests, CLI e2e/harness, and recipes as needed,
    so production barrels stay clean. Leave current placements as-is until this lands.

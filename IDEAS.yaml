- name: daemon-meta-desired-dedup
  task: >-
    Shrink `.daemon.meta.json` so it no longer duplicates recipe/identity fields already on
    `.daemon.desired.json`. Today `DaemonMeta` / `DaemonMetaWrite` and `StartDaemonDesired` share
    `daemonId`, `cronSetup`, `include`, `exclude`, `maxParallelRun` (written from the same
    `StartDaemonRecipe` via `toDesired` + `toMetaWrite` at start) but that is not an invariant:
    operators can edit desired while the pid is up (supervise does not restart a live id on
    desired content change) and can also edit the meta file, so copies drift. Desired is the
    only recipe source of truth (`projectRoot`, `stopping`, include/exclude/cron/maxParallelRun).
    Meta becomes a live process overlay (`inFlightLumpCount`, maybe observed `workspaceStrategy`
    if that still cannot live on desired; drop identity fields and deprecated `lumpName` /
    `busy` from the write path). Consequences: `daemon-status` / `listRunningProjectDaemons`
    must join desired + meta instead of answering identity from meta alone; `fromMeta`
    (`startDaemonDesired`) and supervise `adoptRunningDaemon` (live pid, no desired.json, copy
    recipe from meta) go away or become a one-time migration — pre-desired pid+meta would have
    no recipe once identity is stripped from meta; restart is desired-only (already fail-closed
    when both missing); `createInFlightMetaUpdater` in `launchStartDaemon/runForeground.ts`
    writes only the live overlay instead of rewriting `baseMeta + inFlightLumpCount`. Types:
    `readDaemonMeta/main.ts`, `startDaemonDesired/main.ts`. Docs: `packages/apps/cli/DOCS/commands.md`
    and `concepts.md` daemon files table. Out of scope for the current daemon-lifecycle PR
    (`feat/better-concurrency-error-logs`).
  blocked: >-
    parked: after the current daemon-lifecycle PR (feat/better-concurrency-error-logs)
  tags: [daemon, cli, hygiene]

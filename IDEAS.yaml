- name: daemon-meta-desired-dedup
  task: >-
    Shrink `.daemon.meta.json` so it no longer duplicates recipe/identity fields already on
    `.daemon.desired.json`. Today `DaemonMeta` / `DaemonMetaWrite` and `StartDaemonDesired` share
    `daemonId`, `cronSetup`, `include`, `exclude`, `maxParallelRun` (written from the same
    `StartDaemonRecipe` via `toDesired` + `toMetaWrite` at start) but that is not an invariant:
    operators can edit desired while the pid is up (supervise does not restart a live id on
    desired content change) and can also edit the meta file, so copies drift. Desired is the
    only recipe source of truth (`projectRoot`, `stopping`, include/exclude/cron/maxParallelRun).
    Meta becomes a live process overlay (`inFlightLumpCount`, maybe observed `workspaceStrategy`
    if that still cannot live on desired; drop identity fields and deprecated `lumpName` /
    `busy` from the write path). Consequences: `daemon-status` / `listRunningProjectDaemons`
    must join desired + meta instead of answering identity from meta alone; `fromMeta`
    (`startDaemonDesired`) and supervise `adoptRunningDaemon` (live pid, no desired.json, copy
    recipe from meta) go away or become a one-time migration — pre-desired pid+meta would have
    no recipe once identity is stripped from meta; restart is desired-only (already fail-closed
    when both missing); `createInFlightMetaUpdater` in `launchStartDaemon/runForeground.ts`
    writes only the live overlay instead of rewriting `baseMeta + inFlightLumpCount`.     Types:
    `readDaemonMeta/main.ts`, `startDaemonDesired/main.ts`. Docs: `packages/apps/cli/DOCS/commands.md`
    and `concepts.md` daemon files table.
  tags: [daemon, cli, hygiene]
- name: lock-holder-daemon-id
  task: >-
    Operator-facing diagnostics only. No change to who acquires a lock, how long
    it waits, or which file is locked. When a daemon tick or dedicated discovery
    holds the workspace or git-common-dir lock, write optional daemonId on the
    lock JSON and print it in the fail message, the wait log, and the timeout
    (formatHolderClause). The busy error gains holderDaemonId beside holderPid
    and holderLumpName. A manual lumpcode run omits daemonId. The fake lump name
    "__discovery__" stays; replacing it is generic-lock-holder-label.
  tags: [daemon, cli, hygiene]
- name: generic-lock-holder-label
  task: >-
    Stop requiring a fake `lumpName` on CLI lock APIs when the holder is not a lump run.
    Today `GitCommonDirLockContext` / `WorkspaceLockHolder` and
    `acquireGitCommonDirLock` / `workspacePathLock` / `acquireWorkspaceFileLock` all take
    required `lumpName: string` even though the lock is keyed by git-common-dir or workspace
    path — `lumpName` is only holder identity for busy/wait copy (`formatHolderClause` in
    `workspaceFileLock`). Call sites invent constants (`DISCOVERY_SCAN_LOCK_HOLDER` =
    `'__discovery__'`, `DAEMON_CONFIG_RECONCILE_LOCK_HOLDER` = `'__daemon-config__'`) so
    discovery scan and supervise file-daemon reconcile can acquire a lock. Replace the
    required lump-name field with a generic holder label (real lump names still used when
    the holder is a lump run) so those `__*` constants can go away. Complements
    `lock-holder-daemon-id` (optional `daemonId` on the same payload); that idea still
    treats locks as per-lump (`lumpName` + pid) and still uses `'__discovery__'` as a
    lumpName. CLI lock types and those two fake-name call sites only — not a product
    feature.
  blocked: >-
    Parked until lock-holder-daemon-id has landed. Both edit the lock payload
    and formatHolderClause. This one only replaces the fake lump name. Not for
    autoTriage.
  tags: [cli, hygiene, daemon]
- name: pr-comment-helper

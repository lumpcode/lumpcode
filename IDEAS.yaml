- name: compose-post-setup-workspace-hooks
  task: >-
    Allow custom per-lump workspace prep by composing on top of CLI-generated `workspaceStrategy` (`checkout`
    | `worktree` from `.lumpcode/local.json` via `makeLumpWorkspaceFns`), not by re-exposing raw core
    `setupWorkspaceFn` / `teardownWorkspaceFn` on `LumpJsConfig`. Operators need install deps, copy env
    files, codegen, etc. inside the branch workspace after git setup while keeping correct strategy-owned
    `workspacePath` (locks + agent cwd) and dedicated worktree `afterExec` lock release via `withSetupWorkspaceAfterExec`.
    Preferred: optional lump-config `postSetupWorkspaceFn` (FilePath or fn) receiving `{ baseBranch, branchName,
    contextList, workspacePath, executionWorkspacePath, workspaceStrategy }`, returning optional `{ command?,
    afterExec? }` chained after built-in setup — user must not override `workspacePath`; chain `afterExec`
    so lock-layer release still works. Optional twin `postTeardownWorkspaceFn`. Smaller JSON-only alternative:
    `postSetupWorkspaceCommand` string append (`builtIn && userCommand`). Non-goals: raw setup/teardown
    knobs on lump config; full replace of generated fns unless a later `"custom"` strategy defines a path
    contract for locks. Touch: primarily `packages/apps/cli` (`jsConfigToRunLumpInput`, `makeLumpWorkspaceFns`,
    `LumpJsConfig`, schema, DOCS); core likely unchanged; `withWorkspaceLockHooks` stays outermost if
    path remains strategy-owned. Note: existing `setupFn` is the wrong layer (per-context, after workspace
    setup, no `workspacePath`).

- name: article-git-first-marker-commits
  task: >-
    X article (content only — not engine/docs work) explaining how git-first loop management
    actually works: marker commits, rebase hygiene, and when markers can be dropped. Follow-up
    to `articles/04-why-lumpcode/article.md` (already names Lumpcode a git-first loop manager and
    says progress comes from commit messages on remote branches). Ship as `articles/05-*/article.md`
    plus sibling `article.html` for paste and a 5:2 cover. Positioning piece: keep it quick;
    plain/sharp body; prefer campaign in prose; define lump once; use context only for isolation;
    skip “loop engineering”; git is gate (reviewable PRs) and source of truth (done/left from
    remote history, not a dashboard); anonymize client/mission material. Mechanism: context
    status is derived from marker commits on remote refs. CLI default subject
    `LUMP: <lumpName> - <contextName>` via `getGitCommitMessage({ contextName, lumpName })`;
    core default `LUMP:${context.name}` via `gitCommitMessageFn`. Lifecycle: toDo (no marker
    on any remote ref) → branchPushed (marker on the work-branch remote) → finished (marker
    reaches `origin/<baseBranch>`). Remote git history is the source of truth, which is why
    rebase/squash policy matters. Default advice: keep the marker commits when rebasing a
    lump branch or rebasing/merging toward the integration/`baseBranch`, so status stays
    correct and the campaign stays resumable. Decided exceptions only (do not invent more):
    (1) ephemeral contexts — squash anywhere; one-shot contexts (e.g. abstraction finder /
    `ephemeralContextListFn`) have no later run that needs the marker to skip them;
    (2) file-state discovery — squash only at merge to the lump `baseBranch`; when discovery
    filters on a file that keeps state (e.g. `featureBacklog` / `backlogItems/todo|completed/`
    + `folderSetTaskDoneStep`), the marker must stay while the lump branch is under review
    (`branchPushed`, campaign must not re-pick the context) and may be squashed when that
    branch merges toward the lump `baseBranch` (discovery no longer lists the item, so the
    marker is no longer the finished signal).
  priority: 60
  blocked: >-
    parked: draft when ready (05 follow-up to 04-why-lumpcode)
  tags: [meta, git, status]
- name: memory-pressure-run-gate
  task: >-
    Machine-level soft skip (same operator story as `tooManyOpenBranches`) that refuses to
    start a lump/agent when host available memory is already near the edge. Goal: reduce
    OOM / SIGKILL of dedicated-worker daemons on small VMs (motivating case: Azure
    Standard_B2s 4 GB, several `--include` daemons plus Cursor agents). Soft skip only —
    not a supervisor/respawn and not a wait (waiting for RAM would recreate the lock
    convoy: cron `{ protect: true }` + a wait that never returns). Skip this attempt;
    next cron tick retries. Same skip family as `tooManyOpenBranches` (`skipped: true` +
    reason such as `memoryPressure`); tick continues so other lumps can still run if
    memory recovers. Check immediately before a lump actually runs — same layer as
    `evaluateTooManyOpenBranchesSkip` in `runLumpFromJsConfig`, or one step later right
    before `execBinary` starts the agent. A check only at the start of `runTick` is
    wrong (discovery/lock-wait are cheap; three daemons can all see enough RAM then each
    start Cursor). Metric: available memory (`MemAvailable` on Linux; cgroup
    `memory.current` vs `memory.max` if the daemon is in a unit), not `MemFree`
    (cache-heavy git boxes look full on MemFree). Config in `.lumpcode/local.json` next
    to `maxParallelRun` (machine limit, not lump config); threshold as a percent or a
    floor (“leave N GB”). Does not cap a child already running — an agent can pass the
    gate at 1.2 GB free and then grow to 3 GB; gate only refuses to start another heavy
    process. A single `os.freemem()` read does not reserve RAM; cross-daemon reservation
    (shared claim under `~/.lumpcode/`, or skip if another project daemon’s
    `inFlightLumpCount` > 0 and available < threshold) is optional later design, not
    required for a first gate. On `checkout`, multiple daemons on one clone already
    serialize on the workspace path lock (usually one agent at a time); the gate still
    matters for `worktree` + `maxParallelRun` and for something else on the box already
    eating RAM. Leak-free daemon RSS is not enough: OOM is peak working set (agent child
    + git + OS) vs 4 GB. This is a launch gate, not a leak hunt and not “make 4 GB safe
    for one large agent.” After daemon-run hardening (lock wait 15 min, discovery git
    5 min, SIGHUP ignore, fatal JS log+exit), remaining silent deaths are
    SIGKILL/OOM/host. Non-goals: no systemd supervisor; no new start/stop CLI flags
    unless `local.json` needs a field; no default change of checkout→worktree; no
    waiting-for-RAM; no attempt to kill/limit an in-flight agent. Touch: primarily
    `packages/apps/cli` (`local.json`, `runLumpFromJsConfig` /
    `evaluateTooManyOpenBranchesSkip` layer).
  blocked: >-
    parked: later product work (not current daemon-harden PR)
  tags: [daemon, workspace, config]

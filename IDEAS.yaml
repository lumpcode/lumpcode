- name: cli-command-names-by-group
  task: >-
    Clean CLI command names by group. Canonical name is `<group>-<verb>` (e.g. `daemon-start`,
    `daemon-stop`, `daemon-restart`); today's short names stay as shorthands (`start` → `daemon-start`).
    Apply the same pattern across groups (`lump-plan` / `lump-status` / `lump-create`, `project-setup`)
    so mixed prefixes like `start` vs `daemon-status` go away. Document only the current spelling.
    This idea is naming, not merging commands.
  priority: 25
  blocked: Breaking rename. Decide the alias map before any command moves. Not for autoTriage.
  tags: [cli]
- name: run-start-lump-variable-overrides
  task: >-
    lumpcode run and lumpcode start accept lumpVariables overrides for that
    invocation. The lump file stays unchanged. --contextName stays a separate
    flag that only picks a context.
  priority: 31
  tags: [cli, config]
- name: project-local-tick-hooks
  task: >-
    project.json and local.json may set onBeforeDiscovery, onTickBegin, and
    onTickEnd. Each value is a command string, not a function. When both files
    set the same hook, local.json wins. A daemon tick runs them. A foreground
    lumpcode run does not. Example: npm i once per tick.
  priority: 34
  tags: [daemon, hooks]
- name: yaml-lump-configs
  task: A lump config may be YAML as well as JSON or TypeScript.
  priority: 36
  tags: [config]
  blocked: TypeScript first; JSON is experimental. Revisit only if JSON leaves experimental.
- name: per-lump-git-remote
  task: >-
    Optional git remote name. Default remains origin. May be set on the lump,
    on project.json, or on local.json. The lump value wins, then local.json,
    then project.json. One name, not a list of remotes.
  priority: 42
  tags: [git, config]
- name: lump-marker-prefix-override
  task: >-
    project.json only. Override the lump/ branch prefix and the LUMP marker
    prefix. Each value is a list. The first entry is the prefix in use. Later
    entries are previous prefixes still recognized on branches and marker lines.
    Dropping an old prefix means those older branches and markers stop counting.
  priority: 44
  tags: [git, config]
- name: dynamic-base-branch-from-context-list
  task: >-

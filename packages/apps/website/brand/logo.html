<!doctype html>
<!--
  Logo renders: the mark alone or the lockup (mark + wordmark), as in the site header.
  Query: layout=mark|lockup, bg=dark|none, fish=<px width of the fish>, w and h=<px image size>.
  The fish is public/favicon.svg; the wordmark matches .brand-word in app/assets/css/main.css.
  Rendered by brand/render.mjs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=block">
<style>
  html, body { margin: 0; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body.dark { background: #000514; }
  .mark { display: inline-flex; align-items: center; }
  /* favicon.svg is square; the fish itself spans 650 x 540 of it, centred. */
  .mark img { display: block; margin: calc(var(--fish) * -0.0846) 0; width: var(--fish); }
  /* Header proportions: fish 2.35rem, gap 0.5rem, word 1.42rem. */
  .word {
    margin-left: calc(var(--fish) * 0.2128);
    color: #eef4f6;
    font-size: calc(var(--fish) * 0.6043);
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 1;
  }
</style>
</head>
<body>
<span class="mark"><img src="../public/favicon.svg" alt=""><span class="word">lumpcode</span></span>
<script>
  const params = new URLSearchParams(location.search)
  document.documentElement.style.setProperty('--fish', `${params.get('fish') ?? 300}px`)
  // Explicit size: headless Chrome keeps a minimum window width, so 100vw can exceed the capture.
  document.body.style.width = `${params.get('w')}px`
  document.body.style.height = `${params.get('h')}px`
  if (params.get('bg') === 'dark') document.body.classList.add('dark')
  if (params.get('layout') !== 'lockup') document.querySelector('.word').remove()
</script>
</body>
</html>
